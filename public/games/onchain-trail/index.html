  <body>
    <div id="root"></div>
    
    <!-- Handle deep links -->
    <script>
      // Parse URL params for deep link handling
      (function() {
        const params = new URLSearchParams(window.location.search);
        const ref = params.get('ref');
        const score = params.get('score');
        const ending = params.get('ending');
        
        // Store referral info
        if (ref) {
          sessionStorage.setItem('onchain_trail_ref', ref);
        }
        
        // Store result view info (for showing someone else's result)
        if (score && ending) {
          sessionStorage.setItem('onchain_trail_view_result', JSON.stringify({
            score: parseInt(score),
            ending: ending,
          }));
        }
      })();
    </script>
